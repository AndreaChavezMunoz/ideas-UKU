<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa · Ideas UKU</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body class="mapa">
<header class="nav"></header>
<main>
  <div class="barra">
    <select id="filtro" aria-label="Filtrar por fuente"><option value="">Todas las fuentes</option></select>
    <span class="tenue"><span class="etiqueta mia">●</span> tus ideas</span>
    <div class="temas" id="temas"></div>
  </div>
  <div id="modo-conectar" class="oculto">Toca la idea con la que quieres conectar · <button type="button" class="enlace" id="cancelar-conexion" style="color:#fff">Cancelar</button></div>
  <div id="grafo"></div>
  <p id="vacio" class="tenue oculto" style="padding:1rem">Aún no hay ideas publicadas. <a href="escribir.html">Escribe la primera reflexión</a>.</p>
  <aside id="panel" class="oculto"></aside>
</main>

<script src="vendor/supabase-2.89.0.js"></script>
<script src="vendor/force-graph-1.49.6.min.js"></script>
<script type="module">
import { sb, requerirMiembro, llamarFuncion, pintarNav, esc, fechaCorta, TIPOS } from './js/sesion.js';

const $ = (id) => document.getElementById(id);
pintarNav('mapa.html');
await requerirMiembro();

const css = getComputedStyle(document.documentElement);
const color = (v) => css.getPropertyValue(v).trim();
const PALETA = ['#6E8B74', '#4E79A7', '#B07AA1', '#9C755F', '#59A14F', '#EDC948', '#76B7B2', '#E15759'];

let datos = { ideas: [], conexiones: [], fuentes: new Map(), temas: [], temaDeIdea: new Map() };
let seleccionada = null;
let conectandoDesde = null;
let temaResaltado = null;

const grafo = ForceGraph()($('grafo'))
  .backgroundColor('rgba(0,0,0,0)')
  .autoPauseRedraw(false) // repintar al cambiar selección o tema
  .nodeId('id')
  .nodeRelSize(6)
  .linkColor(() => color('--rule'))
  .linkWidth((l) => (seleccionada && (l.source.id === seleccionada || l.target.id === seleccionada) ? 2.5 : 1))
  .linkLabel((l) => esc(l.relacion))
  .nodeLabel((n) => esc(n.texto))
  .nodeCanvasObject(dibujarNodo)
  .nodePointerAreaPaint((n, c, ctx) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(n.x, n.y, 10, 0, 2 * Math.PI); ctx.fill(); })
  .onNodeClick(alTocarNodo)
  .onBackgroundClick(() => { if (!conectandoDesde) cerrarPanel(); });

function colorNodo(n) {
  const t = datos.temaDeIdea.get(n.id);
  if (temaResaltado && t !== temaResaltado) return color('--rule');
  return t ? PALETA[datos.temas.findIndex((x) => x.id === t) % PALETA.length] : color('--muted');
}

function dibujarNodo(n, ctx, escala) {
  const r = n.id === seleccionada ? 8 : 6;
  ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 2 * Math.PI);
  ctx.fillStyle = colorNodo(n); ctx.fill();
  if (n.es_mia) { ctx.lineWidth = 2.5; ctx.strokeStyle = color('--accent'); ctx.stroke(); }
  if (escala > 1.6 || n.id === seleccionada) {
    const t = n.texto.length > 40 ? n.texto.slice(0, 38) + '…' : n.texto;
    ctx.font = `${11 / escala}px Georgia, serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = color('--ink');
    ctx.fillText(t, n.x, n.y + r + 2 / escala);
  }
}

function ajustarTamano() {
  const caja = $('grafo').getBoundingClientRect();
  grafo.width(caja.width).height(caja.height);
}
addEventListener('resize', ajustarTamano);

async function cargar() {
  const [ideas, conexiones, fuentes, temas, temasIdeas] = await Promise.all([
    sb.from('ideas_publicas').select('*'),
    sb.from('conexiones_publicas').select('*'),
    sb.from('fuentes').select('id,nombre,tipo,fecha'),
    sb.from('temas').select('id,nombre').order('creado_en'),
    sb.from('temas_ideas').select('tema_id,idea_id'),
  ]);
  datos.ideas = ideas.data || [];
  datos.conexiones = conexiones.data || [];
  datos.fuentes = new Map((fuentes.data || []).map((f) => [f.id, f]));
  datos.temas = temas.data || [];
  datos.temaDeIdea = new Map((temasIdeas.data || []).map((t) => [t.idea_id, t.tema_id]));

  const filtro = $('filtro'), actual = filtro.value;
  const conIdeas = [...new Set(datos.ideas.map((i) => i.fuente_id))].map((id) => datos.fuentes.get(id)).filter(Boolean);
  filtro.innerHTML = `<option value="">Todas las fuentes</option>` +
    conIdeas.map((f) => `<option value="${f.id}">${esc(f.nombre)}</option>`).join('');
  filtro.value = actual;

  $('temas').innerHTML = datos.temas.map((t, i) =>
    `<button type="button" class="secundario" data-tema="${t.id}" style="border-color:${PALETA[i % PALETA.length]}">${esc(t.nombre)}</button>`).join('');
  $('temas').querySelectorAll('button').forEach((b) => (b.onclick = () => {
    temaResaltado = temaResaltado === b.dataset.tema ? null : b.dataset.tema;
  }));

  pintar();
}

function pintar() {
  const fuente = $('filtro').value;
  const nodos = datos.ideas.filter((i) => !fuente || i.fuente_id === fuente).map((i) => ({ ...i }));
  const ids = new Set(nodos.map((n) => n.id));
  const enlaces = datos.conexiones
    .filter((c) => ids.has(c.idea_a) && ids.has(c.idea_b))
    .map((c) => ({ ...c, source: c.idea_a, target: c.idea_b }));
  $('vacio').classList.toggle('oculto', datos.ideas.length > 0);
  ajustarTamano();
  grafo.graphData({ nodes: nodos, links: enlaces });
}
$('filtro').onchange = pintar;

// ---------- Panel de la idea ----------
function cerrarPanel() {
  seleccionada = null;
  $('panel').classList.add('oculto');
}

function alTocarNodo(n) {
  if (conectandoDesde) return elegirDestino(n);
  seleccionada = n.id;
  mostrarPanel(n.id);
}

function mostrarPanel(id) {
  const idea = datos.ideas.find((i) => i.id === id);
  const fuente = datos.fuentes.get(idea.fuente_id);
  const tema = datos.temas.find((t) => t.id === datos.temaDeIdea.get(id));
  const relaciones = datos.conexiones
    .filter((c) => c.idea_a === id || c.idea_b === id)
    .map((c) => {
      const otra = datos.ideas.find((i) => i.id === (c.idea_a === id ? c.idea_b : c.idea_a));
      return `<li><span class="etiqueta">${esc(c.relacion)}</span> ${esc(otra?.texto)}
        ${c.es_mia ? `<button type="button" class="enlace" data-borrar="${c.id}">quitar</button>` : ''}</li>`;
    }).join('');

  $('panel').innerHTML = `
    <button type="button" class="enlace cerrar" id="cerrar">✕</button>
    ${idea.es_mia ? '<span class="etiqueta mia">Tu idea</span> ' : ''}${tema ? `<span class="etiqueta">${esc(tema.nombre)}</span>` : ''}
    <h2 style="margin-top:.5rem">${esc(idea.texto)}</h2>
    ${idea.frases_originales.length ? `<ul class="frases">${idea.frases_originales.map((f) => `<li>“${esc(f)}”</li>`).join('')}</ul>` : ''}
    <p class="tenue">${esc(fuente?.nombre)} · ${TIPOS[fuente?.tipo] || ''} · ${fechaCorta(idea.fecha)}</p>
    ${relaciones ? `<h3>Conexiones</h3><ul>${relaciones}</ul>` : ''}
    <div class="acciones">
      ${idea.permite_conexiones ? '<button type="button" id="conectar">Conectar con otra idea</button>' : '<p class="tenue">Esta idea no admite conexiones.</p>'}
      ${idea.es_mia ? '<a class="boton secundario" href="mis-reflexiones.html">Editar en Mis reflexiones</a>' : ''}
    </div>`;
  $('panel').classList.remove('oculto');
  $('cerrar').onclick = cerrarPanel;
  $('conectar')?.addEventListener('click', () => empezarConexion(id));
  $('panel').querySelectorAll('[data-borrar]').forEach((b) => (b.onclick = async () => {
    if (!confirm('¿Quitar esta conexión que creaste?')) return;
    await sb.from('conexiones').delete().eq('id', b.dataset.borrar);
    await cargar(); mostrarPanel(id);
  }));
}

// ---------- Conectar ideas ----------
function empezarConexion(id) {
  conectandoDesde = id;
  $('panel').classList.add('oculto');
  $('modo-conectar').classList.remove('oculto');
}
$('cancelar-conexion').onclick = () => { conectandoDesde = null; $('modo-conectar').classList.add('oculto'); };

function elegirDestino(n) {
  const origen = conectandoDesde;
  conectandoDesde = null;
  $('modo-conectar').classList.add('oculto');
  if (n.id === origen) return mostrarPanel(origen);
  if (!n.permite_conexiones) { alert('Esa idea no admite conexiones.'); return mostrarPanel(origen); }
  const a = datos.ideas.find((i) => i.id === origen);
  $('panel').innerHTML = `
    <h2>Conectar dos ideas</h2>
    <p>«${esc(a.texto)}»</p>
    <form id="form-conexion">
      <label for="relacion">¿Cómo se relacionan?</label>
      <input id="relacion" list="sugerencias" maxlength="120" required placeholder="Ej.: me recordó a">
      <datalist id="sugerencias">
        <option value="me recordó a"><option value="contradice"><option value="complementa">
        <option value="amplía"><option value="es un ejemplo de"><option value="responde a">
      </datalist>
      <p>«${esc(n.texto)}»</p>
      <div class="acciones"><button type="submit">Conectar</button>
        <button type="button" class="secundario" id="cancelar">Cancelar</button></div>
      <p id="error-conexion" class="error oculto"></p>
    </form>`;
  $('panel').classList.remove('oculto');
  $('cancelar').onclick = () => mostrarPanel(origen);
  $('form-conexion').onsubmit = async (e) => {
    e.preventDefault();
    e.submitter.disabled = true;
    const { error } = await sb.from('conexiones').insert({ idea_a: origen, idea_b: n.id, relacion: $('relacion').value.trim() });
    if (error) {
      e.submitter.disabled = false;
      $('error-conexion').textContent = error.code === '23505' ? 'Esa conexión ya existe.' : 'No se pudo conectar: ' + error.message;
      return $('error-conexion').classList.remove('oculto');
    }
    await cargar();
    seleccionada = origen; mostrarPanel(origen);
    // La IA revisa si algún grupo llegó a 5 ideas y le sugiere un nombre
    llamarFuncion('sugerir-tema').then((r) => { if (r.temas?.length) cargar(); }).catch(() => {});
  };
}

await cargar();
</script>
</body>
</html>
